nodeLinker: pnp

packageExtensions:
  "@backstage/cli@*":
    dependencies:
      jest-environment-node: "*"
      jest-environment-jsdom: "*"
  # createBackend resolves package paths into backend-defaults from plugin-api.
  "@backstage/backend-plugin-api@*":
    dependencies:
      "@backstage/backend-defaults": "*"
  "grpc-js-reflection-client@*":
    peerDependencies:
      "@grpc/grpc-js": "*"
      "@grpc/proto-loader": "*"
    dependencies:
      "@grpc/proto-loader": "*"
  # ESLint resolves `extends` from each package .eslintrc under PnP, so expose
  # the same shareable configs/plugins that @backstage/cli depends on.
  "@samuelfabel/plugin-grpc-docs@*":
    dependencies: &eslintDeps
      "@backstage/eslint-plugin": "^0.1.11"
      "@spotify/eslint-config-base": "^15.0.0"
      "@spotify/eslint-config-react": "^15.0.0"
      "@spotify/eslint-config-typescript": "^15.0.0"
      "@typescript-eslint/eslint-plugin": "^8.17.0"
      "@typescript-eslint/parser": "^8.16.0"
      eslint: "^8.57.0"
      eslint-config-prettier: "^9.0.0"
      eslint-plugin-deprecation: "^3.0.0"
      eslint-plugin-import: "^2.31.0"
      eslint-plugin-jest: "^28.9.0"
      eslint-plugin-jsx-a11y: "^6.10.2"
      eslint-plugin-react: "^7.37.2"
      eslint-plugin-react-hooks: "^5.0.0"
      eslint-plugin-unused-imports: "^4.1.4"
  "@samuelfabel/plugin-grpc-docs-backend@*":
    dependencies: *eslintDeps
  "@samuelfabel/plugin-grpc-docs-common@*":
    dependencies: *eslintDeps
  "@samuelfabel/plugin-grpc-docs-node@*":
    dependencies: *eslintDeps
